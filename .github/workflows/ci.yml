name: ci
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y ripgrep
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
      # Boots the tool registry through a plain Node import. Vitest resolves modules differently
      # and neither tsc nor biome sees evaluation order, so an import-cycle temporal-dead-zone
      # crash (a shared Zod fragment read at module scope) is invisible to all three — this is
      # the only step that catches it before the server fails to start.
      - run: node -e "import('./src/tools/register.ts').then(()=>console.log('tools boot ok'))"

  # The compose stack end-to-end: build, boot in `none` tunnel mode against a
  # throwaway vault, then run the same smoke script used locally. Node is on the
  # runner for the smoke's own `node -e` seeder and the `npx` MCP Inspector.
  docker-smoke:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
      - name: Write .env
        run: |
          {
            echo "OWNER_SECRET=$(node -e "console.log(require('crypto').randomBytes(32).toString('base64url'))")"
            echo "TUNNEL_MODE=none"
            echo "PUBLIC_URL=http://localhost:3000"
            echo "ALLOW_INSECURE_PUBLIC_URL=true"
            echo "VAULT_PATH=$GITHUB_WORKSPACE/vault-dev"
            echo "HOST_UID=$(id -u)"
            echo "HOST_GID=$(id -g)"
          } > .env
          mkdir -p vault-dev
      - run: docker compose up -d --build
      # `up -d` returns as soon as the container starts, not when the server listens.
      - name: Wait for /health
        run: |
          for _ in $(seq 1 60); do
            curl -fsS http://localhost:3000/health >/dev/null && exit 0
            sleep 2
          done
          echo "app never answered /health"; exit 1
      - run: bash scripts/docker-smoke.sh
      - if: failure()
        run: docker compose logs app
      - if: always()
        run: docker compose down

  # The prebuilt images `./brainstem up` pulls (see compose.yaml): sha-<7> for
  # every commit on main, plus vX.Y.Z and latest for release tags. Both images
  # build from the repo root; multi-arch so Apple-silicon/ARM hosts pull too.
  publish-images:
    needs: [verify, docker-smoke]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: brainstem-mcp
            dockerfile: Dockerfile
          - name: brainstem-mcp-tunnel
            dockerfile: tunnel/Dockerfile
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=sha,format=short
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
