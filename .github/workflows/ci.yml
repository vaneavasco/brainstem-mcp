name: ci
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y ripgrep
      # A release tag must name the version the code reports: otherwise images tagged vX.Y.Z would
      # hold a server that calls itself something else.
      - name: tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          want="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$want" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json ($want)"; exit 1
          fi
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:scale
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm run build
      # Boots the tool registry through a plain Node import. Vitest resolves modules differently
      # and neither tsc nor biome sees evaluation order, so an import-cycle temporal-dead-zone
      # crash (a shared Zod fragment read at module scope) is invisible to all three — this is
      # the only step that catches it before the server fails to start.
      - run: node -e "import('./src/tools/register.ts').then(()=>console.log('tools boot ok'))"

  # The stdio server is what a colleague installs on their own machine (Claude Desktop bundle,
  # Claude Code): macOS and Windows 11, and no ripgrep there. The whole suite runs on each, as the
  # machine comes — nothing is installed beside Node — so a test that only passes on the Linux
  # runner, or only with ripgrep, shows up here. Phase 6 of the Claude Desktop integration plan:
  # this job gates the published bundle.
  platforms:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # A test that leaves a watcher or a pipe open keeps the worker alive: without this, one such
    # test cost six hours of a macOS runner (GitHub's own ceiling). The suite takes about five.
    timeout-minutes: 25
    steps:
      # the repository's text files are LF; a CRLF checkout would change what the tests read
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: node -e "import('./src/tools/register.ts').then(()=>console.log('tools boot ok'))"

  # The compose stack end-to-end: build, boot in `none` tunnel mode against a
  # throwaway vault, then run the same smoke script used locally. Node is on the
  # runner for the smoke's own `node -e` seeder and the `npx` MCP Inspector.
  docker-smoke:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
      - name: Write .env
        run: |
          {
            echo "OWNER_SECRET=$(node -e "console.log(require('crypto').randomBytes(32).toString('base64url'))")"
            echo "TUNNEL_MODE=none"
            echo "PUBLIC_URL=http://localhost:3000"
            echo "ALLOW_INSECURE_PUBLIC_URL=true"
            echo "VAULT_PATH=$GITHUB_WORKSPACE/vault-dev"
            echo "HOST_UID=$(id -u)"
            echo "HOST_GID=$(id -g)"
          } > .env
          mkdir -p vault-dev
      - run: docker compose up -d --build
      # `up -d` returns as soon as the container starts, not when the server listens.
      - name: Wait for /health
        run: |
          for _ in $(seq 1 60); do
            curl -fsS http://localhost:3000/health >/dev/null && exit 0
            sleep 2
          done
          echo "app never answered /health"; exit 1
      - run: bash scripts/docker-smoke.sh
      - if: failure()
        run: docker compose logs app
      - if: always()
        run: docker compose down

  # The Claude Desktop bundle (.mcpb): esbuild-bundles the stdio server, generates and validates
  # the manifest, packs it into release/, then proves the PACKED file (not just the sources) with
  # the same tests/stdio/** suite the `verify`/`platforms` jobs already ran against the source —
  # see vitest.bundle.config.ts. Runs on every push and PR (the artifact is useful for review even
  # without a tag); a v* tag additionally attaches the bundle to that tag's GitHub release (created
  # as a draft if the human hasn't made one yet — they publish it) and attests its build
  # provenance, so `gh attestation verify` can tie a downloaded .mcpb back to this exact commit
  # and workflow run.
  bundle:
    needs: [verify, platforms]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run bundle
      - run: npm run test:bundle
      - uses: actions/upload-artifact@v7
        with:
          name: brainstem-mcp-bundle
          path: |
            release/*.mcpb
            release/SHA256SUMS
          if-no-files-found: error
      # a pull request from a fork runs with read-only permissions whatever the block above says
      - name: attest build provenance
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: release/*.mcpb
      - name: attach to the GitHub release for this tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="$GITHUB_REF_NAME"
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --draft --title "$tag" \
              --notes "Draft release for $tag — edit and publish by hand (see AGENTS.md's Releasing section)."
          fi
          gh release upload "$tag" release/*.mcpb release/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --clobber

  # The prebuilt images `./brainstem up` pulls (see compose.yaml): sha-<7> for
  # every commit on main, plus vX.Y.Z and latest for release tags. Both images
  # build from the repo root; multi-arch so Apple-silicon/ARM hosts pull too.
  publish-images:
    needs: [verify, docker-smoke, platforms, bundle]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: brainstem-mcp
            dockerfile: Dockerfile
          - name: brainstem-mcp-tunnel
            dockerfile: tunnel/Dockerfile
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=sha,format=short
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BRAINSTEM_BUILD_SHA=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
