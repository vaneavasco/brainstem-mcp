# Configuration comes from .env (created by `./brainstem setup`). Compose interpolates ${VAR} from it.
# Images: CI publishes ghcr.io/vaneavasco/brainstem-mcp{,-tunnel}:sha-<7> for every
# commit on main (plus vX.Y.Z / latest on tags). `./brainstem up` sets
# BRAINSTEM_IMAGE_TAG to the checked-out commit's tag and pulls; when nothing
# prebuilt matches it falls back to `--build`, which tags the local build `dev`.
services:
  app:
    image: ${BRAINSTEM_IMAGE:-ghcr.io/vaneavasco/brainstem-mcp}:${BRAINSTEM_IMAGE_TAG:-dev}
    build: .
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    ports:
      - "${PORT:-3000}:3000"
    environment:
      PUBLIC_URL: ${PUBLIC_URL:-}
      ALLOW_INSECURE_PUBLIC_URL: ${ALLOW_INSECURE_PUBLIC_URL:-false}
      PUBLIC_URL_FILE: ${PUBLIC_URL_FILE:-}
      TUNNEL_MODE: ${TUNNEL_MODE:-quick}
      OWNER_SECRET: ${OWNER_SECRET:?run ./brainstem setup}
      PORT: "3000"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MCP_LEGACY_MODE: ${MCP_LEGACY_MODE:-stateless}
      STORAGE_BACKEND: localfs
      VAULT_PATH: /vault
      VAULT_TIMEZONE: ${VAULT_TIMEZONE:-UTC}
      VAULT_WATCH_POLL_MS: ${VAULT_WATCH_POLL_MS:-}
      DAILY_NOTES_FOLDER: ${DAILY_NOTES_FOLDER:-}
      DAILY_NOTES_FORMAT: ${DAILY_NOTES_FORMAT:-yyyy-MM-dd}
      DAILY_NOTES_TEMPLATE: ${DAILY_NOTES_TEMPLATE:-}
      REQUIRED_FRONTMATTER: ${REQUIRED_FRONTMATTER:-}
      # STATE_DIR is deliberately NOT passed through: under Docker the auth state
      # always lives in the bind-mounted vault (/vault/_brainstem). It exists for
      # tests and `npm run dev` only.
      CIMD_ALLOWED_HOSTS: ${CIMD_ALLOWED_HOSTS:-claude.ai,claude.com}
      ACCESS_TOKEN_TTL_S: ${ACCESS_TOKEN_TTL_S:-3600}
      REFRESH_TOKEN_TTL_S: ${REFRESH_TOKEN_TTL_S:-7776000}
    volumes:
      - "${VAULT_PATH:?run ./brainstem setup}:/vault"
    depends_on:
      tunnel:
        condition: service_started
        required: false
    restart: unless-stopped

  tunnel:
    image: ${BRAINSTEM_TUNNEL_IMAGE:-ghcr.io/vaneavasco/brainstem-mcp-tunnel}:${BRAINSTEM_IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: tunnel/Dockerfile
    profiles: ["tunnel"]
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      TUNNEL_MODE: ${TUNNEL_MODE:-quick}
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
      TUNNEL_TARGET: http://app:3000
      PUBLIC_URL_FILE: /vault/_brainstem/public-url
    volumes:
      - "${VAULT_PATH:?run ./brainstem setup}:/vault"
    restart: unless-stopped
